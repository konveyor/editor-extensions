kind: bugfix
description: >
  Honor proxy settings from the `environment:` block of provider-settings.yaml,
  which previously applied to CA_BUNDLE and ALLOW_INSECURE but silently ignored
  HTTP_PROXY, HTTPS_PROXY and NO_PROXY. Setting a proxy variable to an empty
  string there now disables the proxy for model provider connections. NO_PROXY
  and no_proxy are also combined rather than letting the uppercase form shadow
  the lowercase one, which could discard the bypass list that paired with the
  active proxy setting. The resolved bypass list is now included in the
  "Provider TLS config" log entry.
