kind: bugfix
description: >
  Honor proxy settings from the `environment:` block of provider-settings.yaml,
  which previously applied to CA_BUNDLE and ALLOW_INSECURE but silently ignored
  HTTP_PROXY, HTTPS_PROXY and NO_PROXY. Provider settings now take precedence as
  a unit regardless of casing, and an explicit empty value disables the proxy for
  provider traffic instead of falling back to the inherited one. These settings
  apply only to model requests: global routing is always derived from the process
  environment, so Hub authentication and token refresh keep their inherited proxy
  behavior whether the provider overrides or disables its own. Process-level
  NO_PROXY is now evaluated per destination rather than once up front, so a
  bypass entry for the Hub is honored while other traffic is still proxied. A
  configured proxy also forces the custom dispatcher, so one used with HTTP/2 and
  default TLS settings is no longer silently discarded. NO_PROXY and no_proxy are
  combined rather than letting the uppercase form shadow the lowercase one.
