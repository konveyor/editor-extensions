kind: feature
description: >
  (Preview) Two new commands connect the IDE to Konveyor's agentic platform
  through the Hub. "Konveyor: Start Migration on Cluster" starts a migration
  workflow (such as java-ee-to-quarkus) or a single agent for the open
  application and links to the run in the Konveyor console, where it is
  followed and supervised. "Konveyor: Review Cluster Run Results" fetches a
  run's branch and loads its changed files into the Migration Assistant's
  batch review, to apply or reject per file or review inline. Needs a Hub
  (0.11 or newer) with agentic enabled and profile sync connected.
