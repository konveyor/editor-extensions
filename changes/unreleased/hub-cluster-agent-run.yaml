kind: feature
description: >
  (Preview) New command "Konveyor: Run Migration on Cluster" starts a
  migration workflow (such as java-ee-to-quarkus: plan, execute, verify) or a
  single agent for the open application through the Hub's agentic API, and
  follows it stage by stage in the Migration Assistant chat. The run's output
  streams into the chat, its permission requests appear as Accept/Reject
  cards, and its questions are asked in VS Code's own input; a warning notes
  that unanswered requests fail the run after about three minutes. Needs a
  Hub (0.11 or newer) with agentic enabled and profile sync connected.
