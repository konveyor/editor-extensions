kind: bugfix
description: >
  Amazon Bedrock now works with temporary and profile-based AWS credentials set
  in the `environment:` block of provider-settings.yaml. `AWS_SESSION_TOKEN` was
  dropped, so temporary credentials were rejected, and `AWS_PROFILE` was ignored,
  so a named profile such as one signed in with `aws sso login` fell back to the
  default profile. Credentials written in provider-settings.yaml take precedence
  over AWS variables inherited from the environment VS Code was started from.
